name: Essentia Voice vs Instrumental ONNX parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "model-registry.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/compare_full_essentia.py"
      - "scripts/compare_classification_essentia.py"
      - "scripts/generate_audio_fixtures.py"
      - ".github/workflows/voice-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "model-registry.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/compare_full_essentia.py"
      - "scripts/compare_classification_essentia.py"
      - ".github/workflows/voice-parity.yml"

permissions:
  contents: read

jobs:
  compare-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-embedding-parity.txt
      - name: Install reference Essentia and audio decoder
        run: |
          python -m pip install -r scripts/requirements-embedding-parity.txt
          echo "APT metadata refresh starting $(date -u +%FT%TZ)"
          timeout 300s sudo apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          echo "APT FFmpeg install starting $(date -u +%FT%TZ)"
          timeout 480s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
      - name: Generate reproducible WAV FLAC MP3 inputs
        run: python scripts/generate_audio_fixtures.py
      - name: Download official models; never commit weights
        run: |
          mkdir -p models
          base=https://essentia.upf.edu/models
          fetch() {
            curl --fail --location --retry 2 --retry-delay 3 \
              --connect-timeout 15 --max-time 180 \
              "$base/$1/$2" -o "models/$2"
            test -s "models/$2"
          }
          fetch feature-extractors/discogs-effnet discogs-effnet-bsdynamic-1.onnx
          fetch feature-extractors/discogs-effnet discogs-effnet-bs64-1.pb
          for kind in mtg_jamendo_moodtheme mtg_jamendo_genre voice_instrumental; do
            for ext in onnx json pb; do
              fetch "classification-heads/$kind" "$kind-discogs-effnet-1.$ext"
            done
          done
          test "$(stat -c%s models/discogs-effnet-bsdynamic-1.onnx)" -gt 17000000
          sha256sum models/*
      - name: Build native feature analyzer
        run: cargo build --locked --release
      - name: Validate both Softmax voice classes on identical embeddings
        run: |
          target/release/bliss-mood embedding-dump fixtures/mono-16k.wav \
            --models-dir models --max-patches 4 --threads 1 > embeddings.json
          target/release/bliss-mood classify-feature-embeddings embeddings.json \
            --models-dir models --model voice --threads 1 > voice-head-onnx.json
          python scripts/compare_classification_essentia.py \
            --embeddings embeddings.json \
            --onnx-json voice-head-onnx.json \
            --tf-model models/voice_instrumental-discogs-effnet-1.pb \
            --tf-output model/Softmax \
            --report-output voice-head-parity.json
      - name: Validate full audio decoding and both Voice Softmax scores
        shell: bash
        run: |
          mkdir -p results
          failed=0
          for audio in fixtures/mono-16k.wav fixtures/stereo-44100.wav fixtures/stereo-44100.flac fixtures/stereo-44100.mp3; do
            name=$(basename "$audio")
            target/release/bliss-mood analyze-features "$audio" \
              --models-dir models --models moodtheme,genre,voice --threads 1 --json \
              > "results/$name.onnx.json"
            if ! python scripts/compare_full_essentia.py \
                --audio "$audio" --model voice \
                --onnx-json "results/$name.onnx.json" \
                --models-dir models \
                --report-output "results/$name.parity.json"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Verify read-only Bliss input and incremental three-model SQLite scan
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          with sqlite3.connect("synthetic-bliss.db") as db:
              db.execute("CREATE TABLE TracksV2 (File TEXT NOT NULL, Ignore INTEGER)")
              db.execute("INSERT INTO TracksV2(File, Ignore) VALUES (?, NULL)", ("mono-16k.wav",))
          Path("synthetic-bliss.sha256").write_text(__import__("hashlib").sha256(
              Path("synthetic-bliss.db").read_bytes()).hexdigest())
          PY
          target/release/bliss-mood scan-features \
            --bliss-db synthetic-bliss.db --db synthetic-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --max-new 1 --threads 1 --dry-run --json > scan-dryrun.json
          test ! -e synthetic-feature.db
          target/release/bliss-mood scan-features \
            --bliss-db synthetic-bliss.db --db synthetic-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --max-new 1 --threads 1 --json > scan-first.json
          target/release/bliss-mood scan-features \
            --bliss-db synthetic-bliss.db --db synthetic-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --max-new 1 --threads 1 --dry-run --json > scan-second.json
          python - <<'PY'
          import hashlib, json, sqlite3
          from pathlib import Path
          assert hashlib.sha256(Path("synthetic-bliss.db").read_bytes()).hexdigest() == \
              Path("synthetic-bliss.sha256").read_text()
          first=json.loads(Path("scan-first.json").read_text())
          second=json.loads(Path("scan-second.json").read_text())
          assert first["analyzed"] == 1 and first["failures"] == 0, first
          assert second["up_to_date"] == 1 and second["pending"] == 0, second
          with sqlite3.connect("synthetic-feature.db") as db:
              assert db.execute("PRAGMA user_version").fetchone()[0] == 3
              assert db.execute("SELECT count(*) FROM feature_models").fetchone()[0] == 3
              assert db.execute("SELECT count(*) FROM feature_tracks").fetchone()[0] == 3
              assert db.execute("SELECT count(*) FROM feature_track_state").fetchone()[0] == 3
              assert db.execute("SELECT count(*) FROM mood_tracks").fetchone()[0] == 0
          print("PASS: dry-run untouched, Bliss DB byte-identical, three heads cached and skipped")
          PY
      - name: Verify serial/parallel score parity, exact max-new, and read-only inputs
        run: |
          python - <<'PY'
          import sqlite3, hashlib
          from pathlib import Path
          with sqlite3.connect("parallel-bliss.db") as db:
              db.execute("CREATE TABLE TracksV2 (File TEXT NOT NULL, Ignore INTEGER)")
              db.executemany("INSERT INTO TracksV2(File, Ignore) VALUES (?, NULL)",
                             [(name,) for name in (
                                 "mono-16k.wav", "stereo-44100.wav",
                                 "stereo-44100.flac", "stereo-44100.mp3")])
          Path("parallel-bliss.sha256").write_text(hashlib.sha256(
              Path("parallel-bliss.db").read_bytes()).hexdigest())
          PY
          target/release/bliss-mood scan-features \
            --bliss-db parallel-bliss.db --db serial-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --workers 1 --threads 1 --json > serial.json
          target/release/bliss-mood scan-features \
            --bliss-db parallel-bliss.db --db parallel-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --workers 2 --threads 1 --max-new 2 --json > parallel-first.json
          target/release/bliss-mood scan-features \
            --bliss-db parallel-bliss.db --db parallel-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --workers 2 --threads 1 --max-new 2 --json > parallel-second.json
          target/release/bliss-mood scan-features \
            --bliss-db parallel-bliss.db --db parallel-feature.db \
            --models-dir models --models moodtheme,genre,voice --source-root fixtures \
            --workers auto --threads 1 --dry-run --json > parallel-dryrun.json
          python - <<'PY'
          import hashlib, json, sqlite3
          from pathlib import Path
          assert hashlib.sha256(Path("parallel-bliss.db").read_bytes()).hexdigest() == \
              Path("parallel-bliss.sha256").read_text()
          serial=json.loads(Path("serial.json").read_text())
          first=json.loads(Path("parallel-first.json").read_text())
          second=json.loads(Path("parallel-second.json").read_text())
          preview=json.loads(Path("parallel-dryrun.json").read_text())
          assert serial["analyzed"] == 4 and serial["workers"] == 1, serial
          assert first["analyzed"] == 2 and first["workers"] == 2, first
          assert second["analyzed"] == 2 and second["failures"] == 0, second
          assert preview["pending"] == 0 and preview["workers"] == 0, preview
          with sqlite3.connect("serial-feature.db") as a, \
               sqlite3.connect("parallel-feature.db") as b:
              sql=("SELECT track_file, model_id, model_key, scores_f32_le, patches_analyzed "
                   "FROM feature_tracks ORDER BY track_file, model_id")
              serial_rows=a.execute(sql).fetchall()
              parallel_rows=b.execute(sql).fetchall()
              assert len(serial_rows) == 12
              assert serial_rows == parallel_rows
          print("PASS: 12 score vectors byte-identical, exact max-new, read-only Bliss DB")
          PY
      - name: Stress eight ONNX sessions and verify bounded failing scans
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          Path("stress").mkdir(exist_ok=True)
          Path("invalid").mkdir(exist_ok=True)
          for n in range(8):
              Path(f"stress/track-{n:02}.wav").write_bytes(
                  Path("fixtures/mono-16k.wav").read_bytes())
              Path(f"invalid/track-{n:02}.mp3").write_bytes(b"NOT_VALID_AUDIO")
          for name, ext in (("stress", "wav"), ("invalid", "mp3")):
              with sqlite3.connect(f"{name}-bliss.db") as db:
                  db.execute("CREATE TABLE TracksV2 (File TEXT NOT NULL, Ignore INTEGER)")
                  db.executemany("INSERT INTO TracksV2 VALUES (?, NULL)",
                                [(f"track-{n:02}.{ext}",) for n in range(8)])
          PY
          target/release/bliss-mood scan-features \
            --bliss-db stress-bliss.db --db stress-output.db \
            --models-dir models --models moodtheme,genre,voice --source-root stress \
            --workers 8 --threads 1 --max-new 8 --max-errors 5 --json > stress-summary.json
          python - <<'PY'
          import json,sqlite3
          data=json.load(open("stress-summary.json"))
          assert data["workers"]==8 and data["analyzed"]==8 and data["failures"]==0,data
          with sqlite3.connect("stress-output.db") as db:
              assert db.execute("SELECT count(*) FROM feature_tracks").fetchone()[0]==24
          print("PASS: all eight worker sessions initialize in one ONNX Runtime environment")
          PY
          # The first three invalid sources must stop the run, even though
          # --max-new exceeds the number of successfully analyzed songs.
          set +e
          target/release/bliss-mood scan-features \
            --bliss-db invalid-bliss.db --db invalid-output.db \
            --models-dir models --models moodtheme,genre,voice --source-root invalid \
            --workers 4 --threads 1 --max-new 3 --max-errors 5 \
            > invalid-summary.json 2> invalid-errors.txt
          code=$?
          set -e
          test "$code" -ne 0
          test "$(grep -c '^ANALYSIS FAILED' invalid-errors.txt)" -eq 3
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("invalid-output.db") as db:
              assert db.execute("SELECT count(*) FROM feature_tracks").fetchone()[0]==0
          print("PASS: max-new=3 bounds attempted songs even if all audio fails")
          PY
          # A smaller error budget fails fast without exhausting the library.
          set +e
          target/release/bliss-mood scan-features \
            --bliss-db invalid-bliss.db --db invalid-limit-output.db \
            --models-dir models --models moodtheme,genre,voice --source-root invalid \
            --workers 4 --threads 1 --max-new 8 --max-errors 2 \
            > /dev/null 2> invalid-limit-errors.txt
          code=$?
          set -e
          test "$code" -ne 0
          grep -Eq 'Feature scan stopped after [2-4] errors \(limit 2\)' invalid-limit-errors.txt
          test "$(grep -c '^ANALYSIS FAILED' invalid-limit-errors.txt)" -le 4
          echo "PASS: hard error budget stops bad library scans"
      - name: Verify adaptive scanner stage diagnostics and identical classifications
        run: |
          target/release/bliss-mood scan-features \
            --bliss-db stress-bliss.db --db adaptive-output.db \
            --models-dir models --models moodtheme,genre,voice --source-root stress \
            --workers 6 --adaptive-workers --min-workers 4 --max-workers 8 \
            --threads 1 --max-new 8 --max-errors 3 --json > adaptive-summary.json
          python - <<'PY'
          import json, sqlite3
          data = json.load(open("adaptive-summary.json"))
          assert data["analyzed"] == 8 and data["failures"] == 0, data
          assert data["workers"] == 6, data
          d = data["diagnostics"]
          assert d["completed_songs"] == 8, d
          assert d["initial_workers"] == 6, d
          assert 4 <= d["final_workers"] <= 8, d
          assert d["cumulative_decode_seconds"] > 0, d
          assert d["cumulative_features_seconds"] > 0, d
          assert d["cumulative_inference_seconds"] > 0, d
          assert d["cumulative_hash_seconds"] > 0, d
          assert d["cumulative_model_load_seconds"] > 0, d
          assert d["system_load_samples"] >= 0
          if d["system_load_samples"]:
              assert 0 <= d["system_cpu_average_percent"] <= 100
              assert 0 <= d["system_ram_max_percent"] <= 100
          sql = ("SELECT track_file, model_id, model_key, scores_f32_le "
                 "FROM feature_tracks ORDER BY track_file, model_id")
          with sqlite3.connect("stress-output.db") as a, \
               sqlite3.connect("adaptive-output.db") as b:
              assert a.execute(sql).fetchall() == b.execute(sql).fetchall()
          print("PASS: adaptive and fixed workers yield identical features; native stage profile present")
          PY
      - name: Upload numerical parity summaries (no weights or user music)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-parity-reports
          path: |
            voice-head-parity.json
            results/*.parity.json
          if-no-files-found: warn
          retention-days: 14
