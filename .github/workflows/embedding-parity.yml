name: Essentia embedding parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/compare_embedding_essentia.py"
      - "scripts/requirements-embedding-parity.txt"
      - ".github/workflows/embedding-parity.yml"

permissions:
  contents: read

jobs:
  compare-embeddings:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-embedding-parity.txt

      - name: Install official TensorFlow-enabled Essentia reference
        run: python -m pip install -r scripts/requirements-embedding-parity.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate deterministic 6-second 16 kHz mono WAV
        run: |
          python - <<'PY'
          import math, struct, wave
          sr = 16000
          with wave.open("test-embedding.wav", "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(sr)
              for i in range(6 * sr):
                  t = i / sr
                  signal = (
                      (0.35 + 0.15 * math.sin(2 * math.pi * 1.3 * t))
                      * math.sin(2 * math.pi * 440 * t)
                      + 0.20 * math.sin(2 * math.pi * 880 * t)
                      + 0.12 * math.sin(2 * math.pi * (120 + 85 * t) * t)
                  )
                  if i in (8000, 25000, 60000):
                      signal += 0.15
                  sample = int(32767 * max(-1.0, min(1.0, signal)))
                  out.writeframesraw(struct.pack("<h", sample))
          PY

      - name: Download official embedding weights (reference only)
        run: |
          mkdir -p models
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb \
            -o models/discogs-effnet-bs64-1.pb
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bsdynamic-1.onnx \
            -o models/discogs-effnet-bsdynamic-1.onnx
          test "$(stat -c%s models/discogs-effnet-bs64-1.pb)" -gt 17000000
          test "$(stat -c%s models/discogs-effnet-bsdynamic-1.onnx)" -gt 17000000
          sha256sum models/*

      - name: Export all ONNX Discogs-EffNet embeddings (full short signal)
        run: |
          cargo run --locked --release -- embedding-dump test-embedding.wav \
            --models-dir models --max-patches 64 --threads 1 > onnx-embeddings.json
          python - <<'PY'
          import json
          data = json.load(open("onnx-embeddings.json"))
          assert data["patches_analyzed"] == 4, data["patches_analyzed"]
          assert all(len(e) == 1280 for e in data["embeddings"])
          PY

      - name: Compare TensorFlow and ONNX (numerical assertion)
        run: |
          python scripts/compare_embedding_essentia.py \
            --audio test-embedding.wav \
            --rust-json onnx-embeddings.json \
            --tf-model models/discogs-effnet-bs64-1.pb \
            --report-output embedding-parity-report.json \
            --require-full

      - name: Upload small diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-parity-debug
          path: |
            test-embedding.wav
            onnx-embeddings.json
            embedding-parity-report.json
          if-no-files-found: ignore
          retention-days: 7
