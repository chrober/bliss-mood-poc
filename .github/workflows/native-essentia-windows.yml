name: Native original Essentia C++ Windows x64 (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/essentia_cpp_worker.cpp"
      - "native/CMakeLists.txt"
      - ".github/workflows/native-essentia-windows.yml"
      - "docs/essentia-cpp-windows-native-build.md"
      - "scripts/package_essentia_worker_windows.py"
      - "scripts/test_native_essentia_protocol.py"
      - "scripts/generate_audio_fixtures.py"

permissions:
  contents: read

jobs:
  original-essentia-win64:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install original Essentia C++ build dependencies for MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            python
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-binutils
      - name: Log full build provenance and prepare original MTG sources
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/windows-native
          pacman -Q > build/windows-native/pacman-package-lock-observed.txt
          gcc --version
          cmake --version
          pkg-config --modversion libavcodec libavformat libavutil samplerate eigen3
          git clone --quiet https://github.com/MTG/essentia.git build/windows-native/essentia-source
          cd build/windows-native/essentia-source
          # This commit currently lives in an unmerged PR, not master.
          # Fetch GitHub's immutable PR-head ref explicitly, then verify SHA.
          git fetch --no-tags --depth=1 origin refs/pull/1540/head
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = b0661db99be4a8e2c6fabbe90a996f89786fdd8e
          git status --porcelain
      - name: Configure/build original Essentia via upstream waf, not an in-house port
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd build/windows-native/essentia-source
          # MSYS Python gives a POSIX host environment; GCC and pkgconf
          # are explicitly selected from the MINGW64 target toolchain.
          export CC=/mingw64/bin/gcc
          export CXX=/mingw64/bin/g++
          export PKG_CONFIG=/mingw64/bin/pkg-config
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          # Upstream Essentia is written for GNU C++11/14. GNU++14 keeps
          # M_PI/M_LN2 visible but avoids the C++17 std::byte collision
          # in Windows RPC headers (legacy global byte typedef).
          # Only original dependencies needed by MonoLoader and MusiCNN mel.
          # Avoid unrelated TagLib/YAML/Chromaprint compatibility.
          /usr/bin/python3 waf configure --prefix=/mingw64 --std=gnu++14 --lightweight=libav,libsamplerate,fftw
          /usr/bin/python3 waf -j 4
          /usr/bin/python3 waf install
          pkg-config --modversion essentia
      - name: Inspect actual upstream Essentia PE exports and MinGW import linkage
        shell: msys2 {0}
        run: |
          set -euo pipefail
          diagnostics=build/windows-native
          dll=/mingw64/lib/essentia.dll
          implib=/mingw64/lib/essentia.dll.a
          test -s "$dll"
          test -s "$implib"
          echo "=== Installed original DLL and import archive ==="
          ls -lh "$dll" "$implib"
          echo "=== pkg-config selects ==="
          pkg-config --variable=prefix essentia
          pkg-config --variable=libdir essentia
          pkg-config --libs essentia
          pkg-config --cflags essentia
          pkg-config --modversion essentia
          pkg-config --libs essentia > "$diagnostics/pkg-config-essentia-libs.txt"
          echo "=== All candidate Essentia import archives / DLLs ==="
          find /mingw64/lib /mingw64/bin -maxdepth 1 \
            \( -iname '*essentia*.a' -o -iname '*essentia*.dll' \) -print
          objdump -p "$dll" > "$diagnostics/essentia-dll-pe.txt"
          nm -gC "$implib" > "$diagnostics/essentia-import-nm.txt"
          nm -gC "$dll" > "$diagnostics/essentia-dll-nm.txt"
          echo "=== Actual PE export table header ==="
          grep -A 18 -E '^The Export Tables' "$diagnostics/essentia-dll-pe.txt" || true
          echo "=== Expected original core symbols in PE exports (mangled) ==="
          grep -E '(_ZN8essentia(4init|8shutdown|6Logger|12ParameterMap|14loggerInstance|16debugIndentLevel|20activatedDebugLevels)|_ZNK8essentia)' \
            "$diagnostics/essentia-dll-pe.txt" | head -n 35 || true
          echo "=== Expected original core symbols in import archive (demangled) ==="
          grep -E 'essentia::(init\(|shutdown\(|Logger::debug|ParameterMap::add|loggerInstance|debugIndentLevel|activatedDebugLevels|nameOfType)' \
            "$diagnostics/essentia-import-nm.txt" | head -n 50 || true
          echo "=== Core symbols in DLL symbol table (may include nonexported symbols) ==="
          grep -E 'essentia::(init\(|shutdown\(|Logger::debug|ParameterMap::add|loggerInstance|debugIndentLevel|activatedDebugLevels|nameOfType)' \
            "$diagnostics/essentia-dll-nm.txt" | head -n 50 || true
          echo "=== Symbol table sizes ==="
          wc -l "$diagnostics/essentia-dll-pe.txt" "$diagnostics/essentia-import-nm.txt" "$diagnostics/essentia-dll-nm.txt"
          echo "=== Check all core symbol imports against exact installed archive ==="
          missing=0
          for symbol in 'essentia::init()' 'essentia::shutdown()' \
            'essentia::Logger::debug' 'essentia::ParameterMap::add' \
            'essentia::nameOfType' 'essentia::loggerInstance' \
            'essentia::debugIndentLevel' 'essentia::activatedDebugLevels'; do
            if grep -Fq "$symbol" "$diagnostics/essentia-import-nm.txt"; then
              printf 'FOUND: %s\\n' "$symbol"
            else
              printf 'NOT EXPORTED: %s\\n' "$symbol"
              missing=1
            fi
          done
          if (( missing )); then
            # The import archive genuinely lacks core public C++ API symbols.
            # GNU ld disables automatic exports when a DEF file or explicit
            # dllexport is present. Force PE exports in the ORIGINAL upstream
            # Waf shared build, without modifying any source or DSP algorithm.
            # Capture both sides of the test and require all symbols afterward.
            echo "=== Testing explicit MinGW PE export-all policy (original upstream Waf only) ==="
            cp "$diagnostics/essentia-dll-pe.txt" "$diagnostics/essentia-dll-pe-before.txt"
            cp "$diagnostics/essentia-import-nm.txt" "$diagnostics/essentia-import-nm-before.txt"
            (
              cd build/windows-native/essentia-source
              test "$(git rev-parse HEAD)" = b0661db99be4a8e2c6fabbe90a996f89786fdd8e
              export CC=/mingw64/bin/gcc CXX=/mingw64/bin/g++
              export PKG_CONFIG=/mingw64/bin/pkg-config
              export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
              export LDFLAGS=-Wl,--export-all-symbols
              /usr/bin/python3 waf configure --prefix=/mingw64 --std=gnu++14 --lightweight=libav,libsamplerate,fftw
              /usr/bin/python3 waf -j 4
              /usr/bin/python3 waf install
              test -z "$(git status --porcelain)"
            )
            objdump -p "$dll" > "$diagnostics/essentia-dll-pe.txt"
            nm -gC "$implib" > "$diagnostics/essentia-import-nm.txt"
            nm -gC "$dll" > "$diagnostics/essentia-dll-nm.txt"
          fi
          echo "=== Require linkable original Essentia C++ public symbols ==="
          for symbol in 'essentia::init()' 'essentia::shutdown()' \
            'essentia::Logger::debug' 'essentia::ParameterMap::add' \
            'essentia::nameOfType' 'essentia::loggerInstance' \
            'essentia::debugIndentLevel' 'essentia::activatedDebugLevels'; do
            if ! grep -Fq "$symbol" "$diagnostics/essentia-import-nm.txt"; then
              echo "ERROR: even after export-policy correction import archive lacks $symbol" >&2
              exit 1
            fi
          done
          echo "PASS: native MinGW import library contains all required core API symbols"
      - name: Compile our original Essentia C++ IPC process with MinGW x64
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=/mingw64/bin/gcc
          export CXX=/mingw64/bin/g++
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          cmake -S native -B build/windows-native/worker -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/windows-native/worker --parallel 4 --verbose
          file build/windows-native/worker/bliss-essentia-worker.exe
      - name: Test original native Essentia against real synthetic WAV
        shell: msys2 {0}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/test_native_essentia_protocol.py \
            build/windows-native/worker/bliss-essentia-worker.exe
      - name: Stage actual original Essentia PE and all imported MinGW DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/package_essentia_worker_windows.py \
            --worker build/windows-native/worker/bliss-essentia-worker.exe \
            --objdump /mingw64/bin/objdump.exe \
            --dll-dir /mingw64/bin \
            --output build/windows-native/original-essentia-closed-bundle
          /usr/bin/python3 scripts/package_essentia_worker_windows.py \
            --verify build/windows-native/original-essentia-closed-bundle
      - name: Re-test genuine native worker from isolated DLL-closed bundle
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # Keep the global Mingw runtime outside PATH: the packaged
          # EXE must find every non-OS dependency beside itself.
          env PATH=/usr/bin:/bin /usr/bin/python3 scripts/test_native_essentia_protocol.py \
            build/windows-native/original-essentia-closed-bundle/bliss-essentia-worker.exe
      - name: Upload build diagnostics ONLY (not redistributable native binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-essentia-windows-build-diagnostics
          path: |
            build/windows-native/pacman-package-lock-observed.txt
            build/windows-native/pkg-config-essentia-libs.txt
            build/windows-native/essentia-dll-pe.txt
            build/windows-native/essentia-dll-pe-before.txt
            build/windows-native/essentia-import-nm.txt
            build/windows-native/essentia-import-nm-before.txt
            build/windows-native/essentia-dll-nm.txt
          if-no-files-found: warn
          retention-days: 14
