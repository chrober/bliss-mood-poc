name: Documentation language (English-only)

on:
  push:
    branches: [feat/similarity-metric-evaluation]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_docs_english.py'
      - 'tests/test_check_docs_english.py'
      - '.github/workflows/docs-english.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-markdown:
    name: Verify English Markdown documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: English-only README and docs Markdown
        run: python3 scripts/check_docs_english.py
      - name: Synthetic German-language detection and current tree regression
        run: python3 -m unittest discover -s tests -p 'test_check_docs_english.py'
