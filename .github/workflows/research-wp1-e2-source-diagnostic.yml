name: WP1-E2 MTT source availability - diagnostic only

on:
  push:
    branches: [feat/general-pairwise-similarity-research]
    paths:
      - 'scripts/probe_wp1_e2_mtt_source.py'
      - 'tests/test_probe_wp1_e2_mtt_source.py'
      - 'scripts/probe_wp1_e2_mtt_member.py'
      - 'tests/test_probe_wp1_e2_mtt_member.py'
      - '.github/workflows/research-wp1-e2-source-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Metadata-only source-gate tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Verify bounded HTTP protocol and no false quality inference
        run: python -m unittest discover -s tests -p 'test_probe_wp1_e2_mtt_source.py' -v
      - name: Verify CRC-checked member probe has no audio or private identities
        run: python -m unittest discover -s tests -p 'test_probe_wp1_e2_mtt_member.py' -v

  network_diagnostic:
    name: Public HTTP-206 tiny probes and branch cache LOOKUP ONLY
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Lookup this branch's curated cache without downloading or saving it
        id: clip_cache
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: benchmark-private/mtt-required-1019-clips.zip
          key: mtt-1019-clips-v1-cf210e087ed5-cb6108a10d3a-2972769864
      - name: Three exact bounded HTTP-206 probes; no audio files persisted
        env:
          WP1_CACHE_HIT: ${{ steps.clip_cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/probe_wp1_e2_mtt_source.py \
            --cache-hit "$WP1_CACHE_HIT" \
            --out results/wp1-e2-source-availability.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/wp1-e2-source-availability.json').read_text())
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### WP1-E2 public source access (diagnostic, NOT fusion results)\n\n')
              f.write('- Scoped cache lookup: '+r['scoped_cache_lookup']+'\n')
              f.write('- Source status: '+r['status']+'\n')
              f.write('- Probes: '+', '.join(str(p['part'])+': '+p['status'] for p in r['probes'])+'\n')
              f.write('- Only three 4-KiB ranges checked; 1,019 clips not tested.\n')
          PY
      - name: Gate further source checks on all three small-range PASS
        id: tiny_gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('results/wp1-e2-source-availability.json').read_text())
          print('all_ranges=' + str(all(p['status']=='RANGE_206_PASS'
                                     for p in r['probes'])).lower())
          PY
      - name: Download official metadata and 8-MiB ZIP directory ONLY
        if: steps.tiny_gate.outputs.all_ranges == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-metadata
          base=https://mirg.city.ac.uk/datasets/magnatagatune
          for item in comparisons_final.csv clip_info_final.csv; do
            curl --fail --location --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 150 --max-filesize 10000000 \
              --silent --show-error "$base/$item" -o "benchmark-metadata/$item"
          done
          http=$(curl --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 200 --max-filesize 9000000 \
            --silent --show-error --header 'Accept-Encoding: identity' \
            --range -8388608 --dump-header benchmark-metadata/tail.headers \
            --output benchmark-metadata/zip-tail.bin \
            --write-out '%{http_code}' "$base/mp3.zip.003")
          test "$http" = 206 || { echo 'ZIP tail did not return HTTP 206'; exit 1; }
          test "$(stat -c%s benchmark-metadata/zip-tail.bin)" -eq 8388608
      - name: Verify exactly ONE official referenced clip via ZIP CRC
        if: steps.tiny_gate.outputs.all_ranges == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/wp1-e2-source-availability.json').read_text())
          sizes=[p['part_bytes'] for p in r['probes']]
          Path('benchmark-metadata/parts.txt').write_text(
              ' '.join(map(str,sizes))+'\n',encoding='ascii')
          PY
          read -r p1 p2 p3 < benchmark-metadata/parts.txt
          python scripts/probe_wp1_e2_mtt_member.py \
            --tail benchmark-metadata/zip-tail.bin \
            --part-sizes "$p1" "$p2" "$p3" \
            --comparisons benchmark-metadata/comparisons_final.csv \
            --clips benchmark-metadata/clip_info_final.csv \
            --out results/wp1-e2-one-clip-access.json
          # A blocked one-clip result is a diagnostic, NOT a successful benchmark.
      - name: Publish ONLY anonymized access status (no audio, song IDs, vectors)
        uses: actions/upload-artifact@v4
        with:
          name: wp1-e2-public-source-readiness-only
          path: results/wp1-e2-*.json
          retention-days: 14
