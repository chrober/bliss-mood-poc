name: Essentia Mel parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/compare_mel_essentia.py"
      - ".github/workflows/mel-parity.yml"

permissions:
  contents: read

jobs:
  compare-mel:
    name: Compare Rust with Essentia
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-mel-parity.txt
      - name: Install Essentia (no TensorFlow or model downloads)
        run: python -m pip install -r scripts/requirements-mel-parity.txt
      - name: Install FFmpeg to decode WAV identically
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate deterministic 16-kHz mono WAV
        run: |
          python - <<'PY'
          import math
          import struct
          import wave
          sr = 16000
          with wave.open('test-mel.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(sr)
              for n in range(3 * sr):
                  t = n / sr
                  amp = 0.35 + 0.15 * math.sin(2 * math.pi * 1.3 * t)
                  signal = amp * math.sin(2 * math.pi * 440 * t)
                  signal += 0.2 * math.sin(2 * math.pi * 880 * t)
                  if n == 8000:
                      signal += 0.15
                  out.writeframesraw(struct.pack('<h', int(32767 * max(-1.0, min(1.0, signal)))))
          PY
      - name: Dump Rust log-Mel features
        run: |
          cargo run --locked --release -- mel-dump test-mel.wav --max-frames 32 > rust-mel.json
      - name: Compare Essentia reference (fail on mismatch)
        run: |
          python scripts/compare_mel_essentia.py \
            --audio test-mel.wav \
            --rust-json rust-mel.json
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mel-parity-debug
          path: |
            test-mel.wav
            rust-mel.json
          if-no-files-found: ignore
          retention-days: 7
