name: Native original Essentia C++ worker smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - "scripts/test_native_essentia_protocol.py"
      - ".github/workflows/native-essentia-cpp.yml"

permissions:
  contents: read

jobs:
  original-essentia:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install original Essentia C++ build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake pkg-config python3 python3-numpy \
            libeigen3-dev libyaml-dev libfftw3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libsamplerate0-dev libtag1-dev libchromaprint-dev
      - name: Build pinned original MTG/essentia C++ library (not essentia-rs)
        shell: bash
        run: |
          git clone --quiet https://github.com/MTG/essentia.git "$RUNNER_TEMP/essentia-source"
          cd "$RUNNER_TEMP/essentia-source"
          # Pin Essentia's 2023-07 FFmpeg 4.4 compatibility revision, matching Ubuntu 22.04
          git checkout --quiet 9ceef0a3a7900ad51eb42aa5b6c6789b4bec6a47
          python3 waf configure --prefix="$RUNNER_TEMP/essentia-install"
          python3 waf -j 4
          python3 waf install
      - name: Compile the native worker against installed original C++ algorithms
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/essentia-install/lib/pkgconfig:$RUNNER_TEMP/essentia-install/lib64/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S native -B build/essentia-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/essentia-cpp --parallel 4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build existing Rust reference Mel frontend
        run: cargo build --locked
      - name: Exercise original C++ worker and numeric 12,288-coefficient Rust parity
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/essentia-install/lib:$RUNNER_TEMP/essentia-install/lib64:$LD_LIBRARY_PATH"
          python3 scripts/test_native_essentia_protocol.py build/essentia-cpp/bliss-essentia-worker target/debug/bliss-mood
