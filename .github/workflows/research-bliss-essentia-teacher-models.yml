name: WP3-R2 grouped Bliss-Essentia teacher models (synthetic only)

on:
  push:
    branches: [feat/general-pairwise-similarity-research]
    paths:
      - 'scripts/research_bliss_essentia_teacher_models.py'
      - 'scripts/research_bliss_only_teacher_geometry.py'
      - 'scripts/run_local_bliss_essentia_teacher_study.py'
      - 'scripts/derive_lyrion_research_groups.py'
      - 'scripts/run_grouped_bliss_essentia_research_windows.ps1'
      - 'tests/test_research_bliss_essentia_teacher_models.py'
      - 'tests/test_research_bliss_only_teacher_geometry.py'
      - 'tests/test_run_local_bliss_essentia_teacher_study.py'
      - 'tests/test_derive_lyrion_research_groups.py'
      - 'research/requirements-wp3-r2.txt'
      - 'research/requirements-wp3-py315.txt'
      - '.github/workflows/research-bliss-essentia-teacher-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: No-audio sklearn Ridge/PLS/PCA-CCA (Python 3.15, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Confirm no-write source preflight is importable without site-packages
        run: python -S -c "import sys; sys.path.insert(0, 'scripts'); import derive_lyrion_research_groups as b; assert b.MIN_READY == 24; print('stdlib-only local source preflight ready')"
      - name: Install pinned Python 3.15 statistical packages
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r research/requirements-wp3-py315.txt
      - name: Verify numerical research interpreter and pinned imports
        run: python -c "import sys, numpy, scipy, sklearn; print(sys.version, numpy.__version__, scipy.__version__, sklearn.__version__)"
      - name: Smoke actual launcher Python calls in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          LYRION_WP3_RUNTIME_SMOKE_ONLY: '1'
        run: |
          & .\scripts\run_grouped_bliss_essentia_research_windows.ps1
          if (-not $?) { throw 'Actual Windows PowerShell 5.1 Python argument smoke failed.' }
      - name: Smoke actual launcher Python calls in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LYRION_WP3_RUNTIME_SMOKE_ONLY: '1'
        run: |
          & .\scripts\run_grouped_bliss_essentia_research_windows.ps1
          if (-not $?) { throw 'Actual PowerShell 7 Python argument smoke failed.' }
      - name: Compile train-only and grouped research sources
        run: python -m compileall -q scripts/research_bliss_essentia_teacher_models.py scripts/research_bliss_only_teacher_geometry.py scripts/run_local_bliss_essentia_teacher_study.py scripts/derive_lyrion_research_groups.py scripts/research_grouped_split.py scripts/research_feature_relationships.py
      - name: Fit only synthetic split-train teacher predictions and holdout CCA
        run: python -m unittest discover -s tests -p 'test_research_bliss_essentia_teacher_models.py' -v
      - name: Bliss-only Essentia-distilled geometry vs original Bliss, synthetic teacher only
        run: python -m unittest discover -s tests -p 'test_research_bliss_only_teacher_geometry.py' -v
      - name: WP3 end-to-end joined real-schema read-only synthetic local study
        run: python -m unittest discover -s tests -p 'test_run_local_bliss_essentia_teacher_study.py' -v
      - name: Existing BlissMixerLab artist identity snapshot and Lyrion album metadata adapter
        run: python -m unittest discover -s tests -p 'test_derive_lyrion_research_groups.py' -v
      - name: PowerShell Windows full launcher syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $source = Join-Path (Get-Location).Path 'scripts/run_grouped_bliss_essentia_research_windows.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'The standalone research PowerShell launcher has syntax errors.' }
      - name: Run grouped regression gates
        run: python -m unittest discover -s tests -p 'test_research_grouped_split.py' -v
