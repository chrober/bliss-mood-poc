name: Research - DEAM 240 paired 1280D vs Mood-Genre VA

on:
  push:
    branches: [feat/similarity-metric-evaluation]
    paths:
      - '.github/workflows/research-deam-embedding-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-deam-240-embedding-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deam:
    name: Download, classify and evaluate licensed DEAM research audio
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEAM_LIMIT: '240'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned numerically verified Rust-v5 analyzer (separate tree)
        uses: actions/checkout@v4
        with:
          repository: chrober/bliss-mood-poc
          ref: 2c3d44401436b3b41b6e067199016a1ed2335fbf
          path: validated-rust-v5
          persist-credentials: false
      - name: 'Preflight: synthetic paired DEAM regression and no dataset access'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_benchmark_deam.py'
          python3 -m unittest discover -s tests -p 'test_evaluate_deam_embedding_ab.py'
          python3 -m unittest discover -s tests -p 'test_evaluate_mtt_embedding_ab.py'
          python3 -m unittest discover -s tests -p 'test_check_song_embedding_smoke.py'

      - name: Apply research-only 1280D overlay to pinned Rust-v5 checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_rust_v5_embedding_export.py --checkout validated-rust-v5
          git -C validated-rust-v5 diff --check

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            validated-rust-v5 -> target
          key: research-1280d-v1

      - name: Verify only a bounded sample is requested
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          limit = int(os.environ["DEAM_LIMIT"])
          if not 12 <= limit <= 1802:
              raise SystemExit("DEAM_LIMIT must be between 12 and 1802")
          print("Requested DEAM songs:", limit)
          PY
          echo "deam_sample_policy=frozen-screened-240-seed-20261021" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_cpu_count=$(nproc)" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure FFmpeg, test pooling, and compile pinned Rust-v5 research overlay
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          cargo test --locked --manifest-path validated-rust-v5/Cargo.toml song_embedding::tests
          /usr/bin/time -f 'deam_rust_release_elapsed_s=%e peak_kib=%M' \
            cargo build --release --locked \
            --manifest-path validated-rust-v5/Cargo.toml \
            --target-dir validated-rust-v5/target
          validated-rust-v5/target/release/bliss-mood analyze-features --help | grep -q -- '--embedding-out'

      - name: Download Essentia model files (do not redistribute)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          base=https://essentia.upf.edu/models
          fetch() {
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 900 --silent --show-error \
              "$base/$1/$2" -o "models/$2"
            test -s "models/$2"
          }
          fetch feature-extractors/discogs-effnet discogs-effnet-bsdynamic-1.onnx
          for head in mtg_jamendo_genre mtg_jamendo_moodtheme; do
            fetch classification-heads/$head "$head-discogs-effnet-1.onnx"
            fetch classification-heads/$head "$head-discogs-effnet-1.json"
          done
          test "$(stat -c%s models/discogs-effnet-bsdynamic-1.onnx)" -gt 17000000
          sha256sum models/*
          printf '%s  %s\n' \
            'a280825b334797cf677939db8cd5762c0392aedd0ca6415dbc1cd083f045e43c' models/discogs-effnet-bsdynamic-1.onnx \
            '637acf45315191a2c9a87d5977d48f02da6fc823192fe794a1537c55e7c7ce6a' models/mtg_jamendo_genre-discogs-effnet-1.onnx \
            '7d6270acaa5f4bba4b115a0d6849aca05ed6bd153dcb6d9da4f6ab9f99ef10ff' models/mtg_jamendo_moodtheme-discogs-effnet-1.onnx \
            | sha256sum --check

      - name: Download DEAM noncommercial research archives only to ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-private
          base=https://cvml.unige.ch/databases/DEAM
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 2400 --silent --show-error \
            "$base/DEAM_Annotations.zip" -o benchmark-private/annotations.zip
          /usr/bin/time -f 'deam_audio_download_elapsed_s=%e peak_kib=%M' \
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 30 --max-time 3600 --silent --show-error \
              "$base/DEAM_audio.zip" -o benchmark-private/audio.zip
          test "$(stat -c%s benchmark-private/annotations.zip)" -gt 100000
          test "$(stat -c%s benchmark-private/audio.zip)" -gt 100000000
          # Private metadata inventory for later MTG-Jamendo overlap matching.
          # Only CSV header names are printed; never artist names/track rows.
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --silent --show-error \
            "$base/metadata.zip" -o benchmark-private/metadata.zip
          # Conservative MTG catalog screen; do not publish raw metadata.
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 900 --silent --show-error \
            https://raw.githubusercontent.com/MTG/mtg-jamendo-dataset/master/data/raw.meta.tsv \
            -o benchmark-private/mtg-raw.meta.tsv
          test "$(stat -c%s benchmark-private/mtg-raw.meta.tsv)" -gt 10000
          python3 - <<'PY'
          import zipfile
          import csv, io
          for name in ("benchmark-private/annotations.zip",
                       "benchmark-private/audio.zip",
                       "benchmark-private/metadata.zip"):
              with zipfile.ZipFile(name) as archive:
                  count = len(archive.infolist())
                  if count < 1:
                      raise SystemExit("DEAM archive unexpectedly empty")
                  print("Verified ZIP structure:", name, "members:", count)
                  if name.endswith("metadata.zip"):
                      for entry in archive.namelist():
                          if not entry.lower().endswith(".csv"):
                              continue
                          with archive.open(entry) as source:
                              line = source.readline(8192).decode("utf-8-sig").strip()
                          print("Metadata CSV:", entry, "header:", line[:350])
          
          PY

      - name: Freeze previous screened 240 song cohort, export private 1280D, re-evaluate old seven methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-private results
          /usr/bin/time -f 'deam_240_inference_plus_original_scoring_elapsed_s=%e peak_kib=%M' \
            python3 scripts/benchmark_deam.py \
            --annotations-zip benchmark-private/annotations.zip \
            --audio-zip benchmark-private/audio.zip \
            --binary validated-rust-v5/target/release/bliss-mood \
            --models-dir models \
            --db benchmark-private/deam-features.db \
            --embedding-dir benchmark-private/deam-private-1280d \
            --report results/deam-summary.json \
            --limit "$DEAM_LIMIT" \
            --seed 20261021 \
            --stratify-cohorts \
            --deam-metadata-zip benchmark-private/metadata.zip \
            --mtg-metadata-tsv benchmark-private/mtg-raw.meta.tsv \
            --exclude-mtg-catalog-matches
          python3 - <<'PY'
          import json
          with open("results/deam-summary.json", encoding="utf-8") as f:
              report = json.load(f)
          print("DEAM tracks:", report["dataset"]["songs_evaluated"])
          assert report["dataset"]["sample_id_sha256"] == "db12c5d2692285638a4c25af442f29fd75391eb86cd7f1ea88d2f565d12630d0"
          assert report["dataset"]["annotation_cohort_counts"] == {"earlier_excerpt":197,"full_song_2015":43}
          assert report["dataset"]["overlap_screen"]["excluded_mtg_catalog_candidates"] == 75
          old_mood_va = 0.286784551387186
          new_mood_va = report["per_head"]["moodtheme"]["cosine"]["axes"]["valence_arousal"]["mean_query_spearman"]
          print("Frozen DEAM old Mood Cosine VA:",old_mood_va,
                "signed replay delta:",new_mood_va-old_mood_va)
          assert abs(new_mood_va-old_mood_va)<=0.00002
          print("Collection cohorts:", report["dataset"]["annotation_cohort_counts"])
          print("Catalog overlap screening:", report["dataset"]["train_overlap_check"])
          print("Catalog exclusion counts:", {
              key: value for key, value in report["dataset"]["overlap_screen"].items()
              if key in ("excluded_mtg_catalog_candidates", "eligible_after_exclusion",
                         "deam_metadata_coverage_count")
          })
          for name, group in report.get("subcohorts", {}).items():
              print("Within-collection:", name, "songs:", group["songs_evaluated"])
              print("  Mood cosine VA Spearman:",
                    group["per_head"]["moodtheme"]["cosine"]["axes"]["valence_arousal"]
                    ["mean_query_spearman"])
          for head, metrics in report["per_head"].items():
              print("Head:", head)
              for name, result in metrics.items():
                  x = result["axes"]["valence_arousal"]
                  print(f"  {name}: query Spearman={x['mean_query_spearman']} "
                        f"queries={x['query_count']}")
          PY

      - name: Same-240-song paired embedding vs Mood/Genre and separate-protocol VA Spearman
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'deam_240_paired_evaluation_elapsed_s=%e peak_kib=%M' \
            python3 scripts/evaluate_deam_embedding_ab.py \
              --annotations-zip benchmark-private/annotations.zip \
              --audio-zip benchmark-private/audio.zip \
              --deam-metadata-zip benchmark-private/metadata.zip \
              --mtg-metadata-tsv benchmark-private/mtg-raw.meta.tsv \
              --db benchmark-private/deam-features.db \
              --embedding-dir benchmark-private/deam-private-1280d \
              --previous-filtered-report results/deam-summary.json \
              --out results/deam-240-1280d-vs-heads-aggregate.json
          python3 - <<'PY'
          import json,os
          data=json.load(open("results/deam-240-1280d-vs-heads-aggregate.json"))
          assert data["reference_baseline_reproduced_within_abs_tolerance"]
          assert data["reference_baseline_abs_tolerance"] == 0.00002
          print("DEAM frozen Mood baseline signed 9-axis differences:",
                data["reference_baseline_signed_differences"])
          assert data["songs"] == 240
          assert all(v["query_denominator"]==240 for v in data["full_cohort"]["methods"].values())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\\n## DEAM 240 screened, paired Valence/Arousal (exploratory)\\n\\n")
              f.write("| Method | Mean query VA Spearman | Coverage |\\n|---|---:|---:|\\n")
              for method,v in data["full_cohort"]["methods"].items():
                  f.write(f"| {method} | {v['axes']['valence_arousal']:.4f} | {v['query_coverage']:.1%} |\\n")
              f.write("\\nShared candidates; intervals are sensitivity, not independent CIs. DEAM training overlap unproven.\\n")
          PY

      - name: Upload only aggregate research results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deam-240-1280d-vs-heads-aggregate
          path: |
            results/deam-summary.json
            results/deam-240-1280d-vs-heads-aggregate.json
          if-no-files-found: error
          retention-days: 14
