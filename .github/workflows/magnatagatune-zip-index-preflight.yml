name: MagnaTagATune split ZIP index preflight (audio-free)

on:
  push:
    branches: [feat/similarity-metric-evaluation]
    paths:
      - '.github/workflows/magnatagatune-zip-index-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate ZIP parser offline; reject ambiguous/missing references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_probe_magnatagatune_zip_index.py'
          python3 -m unittest discover -s tests -p 'test_audit_magnatagatune_votes.py'
      - name: Fetch only public comparison and clip metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-private results
          echo "cpus=$(nproc)" >> "$GITHUB_STEP_SUMMARY"
          echo "ram_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)" >> "$GITHUB_STEP_SUMMARY"
          echo "metadata_download_start=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          base=https://mirg.city.ac.uk/datasets/magnatagatune
          for name in comparisons_final.csv clip_info_final.csv; do
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 240 --silent --show-error \
              "$base/$name" -o "benchmark-private/$name"
            test -s "benchmark-private/$name"
          done
          echo "metadata_download_end=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
      - name: HEAD 3 split ZIP parts and request at most 16 MiB of last shard
        shell: bash
        run: |
          set -euo pipefail
          echo "zip_probe_start=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f 'zip_index_wall_seconds=%e peak_rss_kb=%M' \
            python3 scripts/probe_magnatagatune_zip_index.py \
              --comparisons benchmark-private/comparisons_final.csv \
              --clips benchmark-private/clip_info_final.csv \
              --report results/mtt-archive-index-preflight.json
          echo "zip_probe_end=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only aggregate archive membership report (no audio)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mtt-zip-directory-aggregate-preflight
          path: results/mtt-archive-index-preflight.json
          if-no-files-found: error
          retention-days: 14
