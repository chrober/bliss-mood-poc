name: Native similarity cohort bridge (synthetic only)

on:
  push:
    paths:
      - 'scripts/native_similarity_cohort_bridge.py'
      - 'scripts/verify_native_similarity_frozen_inputs.py'
      - 'scripts/bootstrap_native_similarity_scan_compare.ps1'
      - 'tests/test_native_similarity_cohort_bridge.py'
      - 'scripts/run_native_similarity_cohort.ps1'
      - 'scripts/bootstrap_native_similarity_preflight.ps1'
      - '.github/workflows/native-similarity-cohort-bridge.yml'
  pull_request:
    paths:
      - 'scripts/native_similarity_cohort_bridge.py'
      - 'scripts/verify_native_similarity_frozen_inputs.py'
      - 'scripts/bootstrap_native_similarity_scan_compare.ps1'
      - 'tests/test_native_similarity_cohort_bridge.py'
      - '.github/workflows/native-similarity-cohort-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-local-cohort:
    name: Verify read-only 100-song bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synthetic preflight and 100-song parity/rank regression (no private assets)
        run: python -m unittest discover -s tests -p 'test_native_similarity_cohort_bridge.py' -v
      - name: Parse private Windows PowerShell runner without executing scans
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/run_native_similarity_cohort.ps1',
            'scripts/bootstrap_native_similarity_preflight.ps1',
            'scripts/bootstrap_native_similarity_scan_compare.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ("Invalid PowerShell: $path " + ($errors | ForEach-Object { $_.Message } | Out-String))
            }
          }
