name: Essentia end-to-end audio parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/compare_full_essentia.py"
      - "scripts/generate_audio_fixtures.py"
      - ".github/workflows/full-audio-parity.yml"

permissions:
  contents: read

jobs:
  compare-full-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-embedding-parity.txt
      - name: Install Essentia TensorFlow and FFmpeg
        run: |
          python -m pip install -r scripts/requirements-embedding-parity.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate deterministic WAV FLAC MP3 cases
        run: |
          python scripts/generate_audio_fixtures.py
          ffprobe -hide_banner -v error -show_entries stream=codec_name,sample_rate,channels -of json fixtures/stereo-44100.mp3
      - name: Download official ONNX and TF reference models
        run: |
          mkdir -p models
          base=https://essentia.upf.edu/models
          fetch() {
            curl --fail --location --retry 2 --retry-delay 3 \
              --connect-timeout 15 --max-time 180 \
              "$base/$1/$2" -o "models/$2"
            test -s "models/$2"
          }
          fetch feature-extractors/discogs-effnet discogs-effnet-bsdynamic-1.onnx
          fetch feature-extractors/discogs-effnet discogs-effnet-bs64-1.pb
          fetch classification-heads/mtg_jamendo_moodtheme mtg_jamendo_moodtheme-discogs-effnet-1.onnx
          fetch classification-heads/mtg_jamendo_moodtheme mtg_jamendo_moodtheme-discogs-effnet-1.pb
          fetch classification-heads/mtg_jamendo_moodtheme mtg_jamendo_moodtheme-discogs-effnet-1.json
          test "$(stat -c%s models/discogs-effnet-bsdynamic-1.onnx)" -gt 17000000
          test "$(stat -c%s models/discogs-effnet-bs64-1.pb)" -gt 17000000
          sha256sum models/*
      - name: Build Rust release
        run: cargo build --locked --release
      - name: Full end-to-end comparison, all 56 classes and patch counts
        shell: bash
        run: |
          mkdir -p results
          failed=0
          for audio in fixtures/mono-16k.wav fixtures/stereo-44100.wav fixtures/stereo-44100.flac fixtures/stereo-44100.mp3; do
            name=$(basename "$audio")
            echo "::group::Analyzing $name"
            target/release/bliss-mood analyze "$audio" --models-dir models --threads 1 --json > "results/$name.onnx.json"
            if ! python scripts/compare_full_essentia.py \
                --audio "$audio" \
                --onnx-json "results/$name.onnx.json" \
                --models-dir models \
                --report-output "results/$name.parity.json"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("results").glob("*.parity.json")):
              result = json.loads(path.read_text())
              print(f'{path.name}: passed={result["passed"]} '
                    f'patches={result["onnx_patches"]}/{result["essentia_patches"]} '
                    f'max_error={result["maximum_absolute_error"]:.8g}')
          PY
          exit "$failed"
      - name: Upload diagnostic reports (no weights, no user music)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-audio-parity-reports
          path: |
            results/*.parity.json
          if-no-files-found: warn
          retention-days: 14
