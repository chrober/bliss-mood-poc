name: Essentia Mood classifier parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/compare_classification_essentia.py"
      - ".github/workflows/classification-parity.yml"

permissions:
  contents: read

jobs:
  compare-classifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-embedding-parity.txt
      - name: Install TensorFlow-enabled Essentia
        run: python -m pip install -r scripts/requirements-embedding-parity.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate deterministic synthetic 16-kHz WAV
        run: |
          python - <<'PY'
          import math, struct, wave
          sr = 16000
          with wave.open("test-classification.wav", "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(sr)
              for i in range(6 * sr):
                  t = i / sr
                  sample = (
                    (0.35 + 0.15 * math.sin(2 * math.pi * 1.3 * t))
                    * math.sin(2 * math.pi * 440 * t)
                    + 0.2 * math.sin(2 * math.pi * 880 * t)
                    + 0.12 * math.sin(2 * math.pi * (120 + 85 * t) * t)
                  )
                  if i in (8000, 25000, 60000): sample += 0.15
                  out.writeframesraw(struct.pack("<h", int(32767 * max(-1, min(1, sample)))))
          PY
      - name: Download official ONNX and TensorFlow model weights
        run: |
          mkdir -p models
          base=https://essentia.upf.edu/models
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "$base/feature-extractors/discogs-effnet/discogs-effnet-bsdynamic-1.onnx" \
            -o models/discogs-effnet-bsdynamic-1.onnx
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "$base/classification-heads/mtg_jamendo_moodtheme/mtg_jamendo_moodtheme-discogs-effnet-1.onnx" \
            -o models/mtg_jamendo_moodtheme-discogs-effnet-1.onnx
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "$base/classification-heads/mtg_jamendo_moodtheme/mtg_jamendo_moodtheme-discogs-effnet-1.pb" \
            -o models/mtg_jamendo_moodtheme-discogs-effnet-1.pb
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "$base/classification-heads/mtg_jamendo_moodtheme/mtg_jamendo_moodtheme-discogs-effnet-1.json" \
            -o models/mtg_jamendo_moodtheme-discogs-effnet-1.json
          test "$(stat -c%s models/discogs-effnet-bsdynamic-1.onnx)" -gt 17000000
          test "$(stat -c%s models/mtg_jamendo_moodtheme-discogs-effnet-1.pb)" -gt 2500000
          sha256sum models/*
      - name: Export identical ONNX embeddings to feed BOTH classifiers
        run: |
          cargo run --locked --release -- embedding-dump test-classification.wav \
            --models-dir models --max-patches 4 --threads 1 > onnx-embeddings.json
      - name: Classify embeddings with ONNX
        run: |
          cargo run --locked --release -- classify-embeddings onnx-embeddings.json \
            --models-dir models --threads 1 > onnx-classification.json
      - name: Compare 56 per-patch and mean scores with TensorFlow
        run: |
          python scripts/compare_classification_essentia.py \
            --embeddings onnx-embeddings.json \
            --onnx-json onnx-classification.json \
            --tf-model models/mtg_jamendo_moodtheme-discogs-effnet-1.pb \
            --report-output classification-parity-report.json
      - name: Upload diagnostics on failure (not weights)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classification-parity-debug
          path: |
            test-classification.wav
            onnx-embeddings.json
            onnx-classification.json
            classification-parity-report.json
          if-no-files-found: ignore
          retention-days: 7
